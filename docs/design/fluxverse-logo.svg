<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120">
  <!-- FluxVerse logo - 超体宇宙城
       Design law (BRAND §6 + DESIGN §二): 一个点辐射出流线 = 脑塔神经线向全城辐射 = 城的俯视图。
       Five-color law: 数据青 #22d3ee / 资金金 #f5c542 / 流量品红 #f45bb0 / 警示红 #ff4d4d / CEO 纯白 #ffffff.
       Pure 2D pixel blocks (rects only) - 全 2D 铁律. 2026-09-23 CPH4 Labs. -->
  <rect x="4" y="12" width="96" height="96" rx="12" fill="#070b14" stroke="#1a2334" stroke-width="2"/>
  <!-- stars -->
  <rect x="14" y="22" width="1" height="1" fill="#ffffff" opacity=".7"/><rect x="88" y="18" width="1" height="1" fill="#ffffff" opacity=".6"/>
  <rect x="76" y="30" width="1" height="1" fill="#ffffff" opacity=".5"/><rect x="24" y="34" width="1" height="1" fill="#ffffff" opacity=".4"/>
  <!-- brain tower: white CEO light + glow rings + cyan body -->
  <rect x="44" y="18" width="12" height="6" fill="#ffffff"/>
  <rect x="41" y="14" width="18" height="3" fill="#ffffff" opacity=".28"/>
  <rect x="38" y="11" width="24" height="2" fill="#ffffff" opacity=".14"/>
  <rect x="46" y="24" width="8" height="30" fill="#0e7490"/>
  <rect x="47" y="24" width="3" height="30" fill="#22d3ee" opacity=".55"/>
  <!-- radiating neural lines (pixel steps): tower -> three cities -->
  <path d="M50 26 L38 40 L36 56 L32 72 L28 84" stroke="#22d3ee" stroke-width="1" opacity=".38" fill="none"/>
  <path d="M50 26 L52 40 L52 56 L54 74" stroke="#f5c542" stroke-width="1" opacity=".38" fill="none"/>
  <path d="M50 26 L62 38 L68 52 L72 66 L76 78" stroke="#f45bb0" stroke-width="1" opacity=".38" fill="none"/>
  <!-- river band -->
  <rect x="10" y="92" width="84" height="4" fill="#22d3ee" opacity=".22"/>
  <rect x="10" y="93" width="84" height="1" fill="#22d3ee" opacity=".4"/>
  <!-- hub node at tower base -->
  <rect x="45" y="70" width="10" height="6" fill="#062a36" stroke="#22d3ee" stroke-opacity=".4"/>
  <!-- GAME city: cyan block cluster -->
  <rect x="20" y="84" width="12" height="12" fill="#0e2a3a"/>
  <rect x="21" y="86" width="3" height="3" fill="#22d3ee" opacity=".8"/><rect x="26" y="88" width="3" height="3" fill="#22d3ee" opacity=".55"/>
  <rect x="22" y="92" width="3" height="3" fill="#22d3ee" opacity=".35"/>
  <!-- QUANT city: gold twisted tower -->
  <rect x="52" y="74" width="10" height="22" fill="#2a2008"/>
  <rect x="53" y="74" width="3" height="22" fill="#f5c542" opacity=".65"/>
  <rect x="54" y="70" width="6" height="4" fill="#f5c542"/>
  <!-- MEDIA city: magenta twin spheres -->
  <rect x="74" y="78" width="8" height="8" fill="#3a0c28"/>
  <rect x="75" y="79" width="6" height="6" fill="#f45bb0" opacity=".7"/>
  <rect x="78" y="88" width="7" height="7" fill="#3a0c28"/>
  <rect x="79" y="89" width="5" height="5" fill="#f45bb0" opacity=".5"/>
  <!-- wordmark -->
  <text x="118" y="58" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="bold" fill="#f0f6ff" letter-spacing="6">FLUXVERSE</text>
  <text x="120" y="80" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="15" fill="#22d3ee" letter-spacing="8">超体宇宙城</text>
  <text x="120" y="97" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#7b8aa3" letter-spacing="2">数字生命栖居的现实链接元宇宙 · 城因现实而活，现实因城而治</text>
</svg>
